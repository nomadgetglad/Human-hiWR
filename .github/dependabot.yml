# Dependabot checks your dependencies every week and opens a pull request
# when a safer version is out. You still review and merge each one.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/ui"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/tests"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/ui/web"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
